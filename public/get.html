<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get TrackMe — Privacy-First GPS Tracker</title>
  <meta name="description" content="Download TrackMe for Android and iOS. Offline-first, privacy-first GPS tracking.">
  <meta property="og:title" content="Get TrackMe">
  <meta property="og:description" content="Privacy-first, offline-first GPS tracking app for Android & iOS.">
  <meta property="og:url" content="https://trackme.shvms.in/get">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <style>
    :root {
      --bg: #111318;
      --card-bg: #1A1D24;
      --text: #F3F4F6;
      --text-muted: #9CA3AF;
      --brand: #00E676;
      --btn-bg: #2563EB;
      --btn-text: #FFFFFF;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 420px;
      margin: 24px;
      padding: 36px 24px;
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }
    .logo {
      width: 72px;
      height: 72px;
      margin-bottom: 16px;
      border-radius: 18px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 8px 0;
    }
    p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn-primary {
      background: var(--btn-bg);
      color: var(--btn-text);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn:hover {
      opacity: 0.9;
    }
    .spinner {
      margin: 16px auto;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: var(--brand);
      animation: spin 0.8s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    /**
     * TASK-359 / TASK-360: Universal Store Redirect & Attribution Bridge (/get, /r).
     *
     * Preserves UTM acquisition metadata across Android (Play Store Install Referrer),
     * iOS/iPadOS (App Store Campaign Token), and Desktop Web fallback without collecting PII.
     */
    (function() {
      var params = new URLSearchParams(window.location.search);
      var source = params.get('utm_source') || 'route_card';
      var medium = params.get('utm_medium') || 'share';
      var campaign = params.get('utm_campaign') || '';

      var playStoreUrl = 'https://play.google.com/store/apps/details?id=in.shvms.trackme';
      var referrerParams = 'utm_source=' + encodeURIComponent(source) + '&utm_medium=' + encodeURIComponent(medium);
      if (campaign) referrerParams += '&utm_campaign=' + encodeURIComponent(campaign);
      var androidTarget = playStoreUrl + '&referrer=' + encodeURIComponent(referrerParams);

      var appleStoreUrl = 'https://apps.apple.com/app/id6800161248';
      var iosTarget = appleStoreUrl + '?pt=128001612&ct=' + encodeURIComponent(source) + '&mt=8';

      var webTarget = '/?utm_source=' + encodeURIComponent(source) + '&utm_medium=' + encodeURIComponent(medium);
      if (campaign) webTarget += '&utm_campaign=' + encodeURIComponent(campaign);

      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var isAndroid = /android/i.test(ua);
      var isIOS = (/iPad|iPhone|iPod/i.test(ua) && !window.MSStream) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var visitorOS = isAndroid ? 'android' : (isIOS ? 'ios' : 'desktop');

      var target = webTarget;
      if (isAndroid) {
        target = androidTarget;
      } else if (isIOS) {
        target = iosTarget;
      }

      // Emit keepalive redirect telemetry before navigating away so top-of-funnel /get clicks are measured
      try {
        fetch('/api/telemetry/event', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          keepalive: true,
          body: JSON.stringify({
            event: 'get_redirect_visited',
            properties: {
              os: visitorOS,
              utm_source: source,
              utm_medium: medium,
              utm_campaign: campaign || 'default',
              surface: 'get_redirect'
            }
          })
        }).catch(function() {});
      } catch (_) {}

      // Automatically redirect
      window.location.replace(target);

      window.addEventListener('DOMContentLoaded', function() {
        var androidBtn = document.getElementById('btn-android');
        var iosBtn = document.getElementById('btn-ios');
        if (androidBtn) androidBtn.href = androidTarget;
        if (iosBtn) iosBtn.href = iosTarget;
      });
    })();
  </script>
</head>
<body>
  <div class="container">
    <img src="/assets/icon-192.png" alt="TrackMe" class="logo" onerror="this.src='/assets/logo.png'">
    <h1>TrackMe — GPS Tracker</h1>
    <p>Redirecting you to the download page...</p>
    <div class="spinner"></div>
    <div class="btn-group">
      <a id="btn-android" class="btn btn-primary" href="https://play.google.com/store/apps/details?id=in.shvms.trackme">
        Get it on Google Play
      </a>
      <a id="btn-ios" class="btn btn-secondary" href="https://apps.apple.com/app/id6800161248">
        Download on the App Store
      </a>
    </div>
  </div>
</body>
</html>
