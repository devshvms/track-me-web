name: Deploy Web Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Build and deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@56.2.0

      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifacts
        # `vercel build` runs off-Vercel here, so Vercel does not inject the
        # project env vars — and FIREBASE_WEB_CONFIG / POSTHOG_DASHBOARD_URL are
        # marked Sensitive, so `vercel pull` never downloads them. Both are public
        # client-side config; supply them from GitHub secrets so the build's
        # write-*-config scripts can generate the public config files.
        env:
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
          POSTHOG_DASHBOARD_URL: ${{ secrets.POSTHOG_DASHBOARD_URL }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifacts
        # The prebuilt output (function bundles + assets) exceeds Vercel's 15000
        # per-deploy file limit; upload it as a single tarball instead.
        run: vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"
